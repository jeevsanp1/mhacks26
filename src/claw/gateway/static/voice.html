<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claw voice</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #d8d4cc;
      --user: #e8e4dc;
      --bot: #fff;
      --accent: #1a1a1a;
      --danger: #9b2c2c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 650; }
    #status { font-size: 0.85rem; color: var(--muted); }
    #status.ok { color: #2f6b4f; }
    #status.bad { color: var(--danger); }
    #log {
      flex: 1;
      overflow: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      font-size: 1.15rem;
    }
    .msg {
      max-width: 42rem;
      padding: 0.8rem 1rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.assistant { align-self: flex-start; background: var(--bot); }
    .msg.assistant code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      background: rgba(0, 0, 0, 0.06);
      padding: 0.1em 0.3em;
      border-radius: 4px;
    }
    .msg.user.pending { color: var(--muted); }
    .turn { display: flex; flex-direction: column; gap: 0.65rem; }
    details.tools {
      align-self: flex-start;
      width: min(42rem, 100%);
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: #faf9f6;
    }
    details.tools > summary {
      cursor: pointer;
      padding: 0.45rem 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: #2f6b4f;
      list-style: none;
      user-select: none;
    }
    details.tools > summary::-webkit-details-marker { display: none; }
    details.tools > summary::before { content: "▸ "; color: var(--muted); }
    details.tools[open] > summary::before { content: "▾ "; }
    details.tools.running > summary { color: #8a6d1f; }
    .tool-entry { border-top: 1px solid var(--line); padding: 0.5rem 0.75rem; }
    .tool-entry .name {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .tool-entry .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0.35rem 0 0.15rem;
    }
    .tool-entry pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 0.78rem/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      max-height: 18rem;
      overflow: auto;
    }
    .msg.meta {
      align-self: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 0.2rem;
    }
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      padding: 1.25rem;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    #talk {
      width: 7rem;
      height: 7rem;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }
    #talk:disabled { opacity: 0.4; cursor: wait; }
    #talk.recording { background: var(--danger); }
    #hint { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Claw — voice</h1>
    <span id="status">connecting…</span>
  </header>
  <div id="log"></div>
  <footer>
    <button id="talk" disabled>Hold to talk</button>
    <span id="hint">Press and hold, speak, then release.</span>
    <audio id="player" style="display:none"></audio>
  </footer>
  <script>
    const log = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const talkBtn = document.getElementById("talk");
    const hint = document.getElementById("hint");
    const player = document.getElementById("player");

    const TARGET_RATE = 16000;
    const CHUNK_SAMPLES = TARGET_RATE / 10; // ~100 ms per frame
    const TAIL_MS = 200; // keep capturing briefly after release so the last word isn't clipped
    const IDLE_HINT = "Press and hold, speak, then release.";

    let ws = null;
    let audioCtx = null;
    let recording = false; // button held
    let capturing = false; // sending PCM (recording + release tail)
    let tailTimer = null;
    let pcmQueue = [];
    let pcmQueued = 0;
    let resampleCarry = new Float32Array(0);
    let resamplePos = 0;
    let uttId = 0;
    // Browser recognition gives word-by-word interim text; ElevenLabs partials only
    // arrive about once a second, so they are just the fallback display.
    const BrowserSR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null;
    const browserLiveIds = new Set();
    const userBubbles = new Map();
    const turns = new Map(); // utterance id -> reply turn state
    // Reply audio arrives as audio_start{id, format}, binary chunks, audio_end.
    // Replies to utterances older than mutedBelow were barged in on and are dropped.
    let mutedBelow = 0;
    let incoming = null; // {id, format, skip, mp3Parts}
    let pcmCarry = null;
    let nextPlayTime = 0;
    const liveSources = new Set();

    function stopPlayback() {
      player.pause();
      player.currentTime = 0;
      if (player.src) URL.revokeObjectURL(player.src);
      player.removeAttribute("src");
      player.load();
      for (const src of liveSources) { try { src.stop(); } catch {} }
      liveSources.clear();
      nextPlayTime = 0;
      pcmCarry = null;
    }

    function playPcmChunk(data, sampleRate) {
      if (!audioCtx) return;
      let bytes = new Uint8Array(data);
      if (pcmCarry) {
        const joined = new Uint8Array(pcmCarry.length + bytes.length);
        joined.set(pcmCarry);
        joined.set(bytes, pcmCarry.length);
        bytes = joined;
        pcmCarry = null;
      }
      if (bytes.length % 2) {
        pcmCarry = bytes.slice(-1);
        bytes = bytes.slice(0, -1);
      }
      if (!bytes.length) return;
      const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.length / 2);
      const buffer = audioCtx.createBuffer(1, pcm.length, sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) channel[i] = pcm[i] / 0x8000;
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      const startAt = Math.max(audioCtx.currentTime + 0.03, nextPlayTime);
      src.start(startAt);
      nextPlayTime = startAt + buffer.duration;
      liveSources.add(src);
      src.onended = () => liveSources.delete(src);
    }

    function onAudioStart(frame) {
      const muted = frame.id != null && frame.id < mutedBelow;
      if (!muted) stopPlayback();
      incoming = { id: frame.id, format: frame.format, skip: muted || recording, mp3Parts: [] };
    }

    function onAudioChunk(data) {
      if (!incoming || incoming.skip || recording) return;
      const pcm = /^pcm_(\d+)$/.exec(incoming.format || "");
      if (pcm) playPcmChunk(data, Number(pcm[1]));
      else incoming.mp3Parts.push(data);
    }

    function onAudioEnd() {
      if (incoming && !incoming.skip && !recording && incoming.mp3Parts.length) {
        player.src = URL.createObjectURL(new Blob(incoming.mp3Parts, { type: "audio/mpeg" }));
        player.play().catch(() => {});
      }
      incoming = null;
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderText(el, text) {
      el.innerHTML = escapeHtml(text)
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function addMsg(role, text) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      if (role === "assistant") renderText(el, text);
      else el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/voice`);
      ws.binaryType = "arraybuffer";

      ws.onopen = async () => {
        setStatus("requesting microphone…");
        try {
          ws.send(JSON.stringify({ type: "prewarm" }));
          if (!audioCtx) await setupRecorder();
          setStatus("connected", "ok");
          talkBtn.disabled = false;
        } catch (err) {
          setStatus("microphone access denied", "bad");
          addMsg("meta", String(err));
        }
      };

      ws.onmessage = (ev) => {
        if (typeof ev.data !== "string") {
          onAudioChunk(ev.data);
          return;
        }
        let frame;
        try { frame = JSON.parse(ev.data); } catch { return; }

        const id = frame.id;
        if (frame.type === "audio_start") {
          onAudioStart(frame);
        } else if (frame.type === "audio_end") {
          onAudioEnd();
        } else if (frame.type === "transcript_partial") {
          if (!browserLiveIds.has(id)) setUserText(id, frame.text, true);
        } else if (frame.type === "transcript_final") {
          setUserText(id, frame.text, false);
        } else if (frame.type === "filler") {
          addMsg("meta", frame.text || "…");
          hint.textContent = frame.text || "Working…";
        } else if (frame.type === "reply_delta") {
          appendText(getTurn(id), frame.delta);
          hint.textContent = IDLE_HINT;
        } else if (frame.type === "tool") {
          const turn = getTurn(id);
          const info = { id: frame.toolCallId, name: frame.name, args: frame.args, result: frame.result };
          if (frame.phase === "call") addTool(turn, info);
          else if (frame.phase === "result") finishTool(turn, info);
        } else if (frame.type === "turn") {
          setUserText(id, frame.transcript, false);
          const turn = getTurn(id);
          if (!turn.sawText) appendText(turn, frame.reply);
          endTurn(turn);
          hint.textContent = IDLE_HINT;
        } else if (frame.type === "error") {
          const bubble = userBubbles.get(id);
          if (bubble && bubble.classList.contains("pending")) bubble.remove();
          addMsg("meta", frame.message);
          hint.textContent = IDLE_HINT;
        }
      };

      ws.onclose = () => {
        setStatus("disconnected — retrying…", "bad");
        talkBtn.disabled = true;
        stopTalking();
        endUtterance();
        incoming = null;
        setTimeout(connect, 1500);
      };

      ws.onerror = () => setStatus("connection error", "bad");
    }

    function setUserText(id, text, pending) {
      let bubble = userBubbles.get(id);
      if (!bubble) {
        bubble = addMsg("user", "");
        userBubbles.set(id, bubble);
      }
      if (pending && !bubble.classList.contains("pending") && bubble.textContent) return;
      bubble.textContent = text || "…";
      bubble.classList.toggle("pending", pending);
      log.scrollTop = log.scrollHeight;
    }

    // ---- reply rendering (mirrors the TUI / chat page) ----
    // Each utterance's reply lives in a .turn box right after its user bubble.
    // Consecutive tool calls share one collapsible group; text after a tool
    // starts a new bubble below it.

    function getTurn(id) {
      let turn = turns.get(id);
      if (!turn) {
        const box = document.createElement("div");
        box.className = "turn";
        const anchor = userBubbles.get(id);
        if (anchor) anchor.after(box);
        else log.appendChild(box);
        turn = { box, textEl: null, textBuf: "", group: null, tools: new Map(), sawText: false };
        turns.set(id, turn);
      }
      return turn;
    }

    function appendText(turn, delta) {
      if (!turn.textEl) {
        turn.textEl = document.createElement("div");
        turn.textEl.className = "msg assistant";
        turn.box.appendChild(turn.textEl);
        turn.textBuf = "";
        turn.group = null;
      }
      turn.textBuf += delta;
      turn.sawText = true;
      renderText(turn.textEl, turn.textBuf);
      log.scrollTop = log.scrollHeight;
    }

    function pretty(value) {
      if (value === undefined || value === null || value === "") return "";
      let text = value;
      if (typeof value === "string") {
        try { text = JSON.stringify(JSON.parse(value), null, 2); } catch { text = value; }
      } else {
        text = JSON.stringify(value, null, 2);
      }
      return text.length > 4000 ? text.slice(0, 4000) + "…" : text;
    }

    function updateGroup(group) {
      const entries = group.entries;
      const done = entries.every((e) => e.done);
      const names = entries.map((e) => e.name);
      const counts = new Map();
      for (const n of names) counts.set(n, (counts.get(n) || 0) + 1);
      let label;
      if (counts.size === 1) {
        const [name, n] = counts.entries().next().value;
        label = n > 1 ? `${name} ×${n}` : name;
      } else if (names.length <= 3) {
        label = names.join(", ");
      } else {
        label = `${names.length} tools`;
      }
      group.summary.textContent = `${done ? "✓" : "⚙"} ${label}`;
      group.details.classList.toggle("running", !done);
    }

    function renderEntry(entry) {
      const el = entry.el;
      el.replaceChildren();
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = `${entry.done ? "✓" : "⚙"} ${entry.name}`;
      el.appendChild(name);
      for (const [label, value] of [["args", entry.args], ["result", entry.result]]) {
        const body = pretty(value);
        if (!body) continue;
        const l = document.createElement("div");
        l.className = "label";
        l.textContent = label;
        const pre = document.createElement("pre");
        pre.textContent = body;
        el.append(l, pre);
      }
    }

    function addTool(turn, { id, name, args, result, done }) {
      if (!turn.group) {
        const details = document.createElement("details");
        details.className = "tools";
        const summary = document.createElement("summary");
        details.appendChild(summary);
        turn.box.appendChild(details);
        turn.group = { details, summary, entries: [] };
        turn.textEl = null;
      }
      const el = document.createElement("div");
      el.className = "tool-entry";
      turn.group.details.appendChild(el);
      const entry = { name: name || "tool", args, result, done: !!done, el, group: turn.group };
      turn.group.entries.push(entry);
      if (id) turn.tools.set(id, entry);
      renderEntry(entry);
      updateGroup(turn.group);
      log.scrollTop = log.scrollHeight;
    }

    function finishTool(turn, { id, name, result }) {
      const entry = id && turn.tools.get(id);
      if (!entry) {
        addTool(turn, { id, name, result, done: true });
        return;
      }
      entry.result = result;
      entry.done = true;
      renderEntry(entry);
      updateGroup(entry.group);
    }

    function endTurn(turn) {
      for (const entry of turn.tools.values()) {
        if (!entry.done) { entry.done = true; renderEntry(entry); updateGroup(entry.group); }
      }
    }

    const WORKLET_SRC = `
      class PcmTap extends AudioWorkletProcessor {
        process(inputs) {
          const ch = inputs[0] && inputs[0][0];
          if (ch) this.port.postMessage(ch.slice(0));
          return true;
        }
      }
      registerProcessor("pcm-tap", PcmTap);
    `;

    async function setupRecorder() {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
      audioCtx = new AudioContext();
      const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }));
      await audioCtx.audioWorklet.addModule(url);
      const source = audioCtx.createMediaStreamSource(stream);
      const tap = new AudioWorkletNode(audioCtx, "pcm-tap");
      tap.port.onmessage = (e) => { if (capturing) pushSamples(e.data); };
      source.connect(tap);
      // The tap writes no output, but some browsers only pull nodes that reach the destination.
      tap.connect(audioCtx.destination);
    }

    // Linear-interpolation resample from the context rate down to 16 kHz.
    function resample(input) {
      const ratio = audioCtx.sampleRate / TARGET_RATE;
      const buf = new Float32Array(resampleCarry.length + input.length);
      buf.set(resampleCarry);
      buf.set(input, resampleCarry.length);
      const out = [];
      let pos = resamplePos;
      while (pos + 1 < buf.length) {
        const i = Math.floor(pos);
        const frac = pos - i;
        out.push(buf[i] + (buf[i + 1] - buf[i]) * frac);
        pos += ratio;
      }
      const keep = Math.floor(pos);
      resampleCarry = buf.slice(keep);
      resamplePos = pos - keep;
      return out;
    }

    function pushSamples(input) {
      const samples = resample(input);
      const pcm = new Int16Array(samples.length);
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      pcmQueue.push(pcm);
      pcmQueued += pcm.length;
      if (pcmQueued >= CHUNK_SAMPLES) flushPcm();
    }

    function flushPcm() {
      if (!pcmQueued) return;
      const merged = new Int16Array(pcmQueued);
      let off = 0;
      for (const part of pcmQueue) { merged.set(part, off); off += part.length; }
      pcmQueue = [];
      pcmQueued = 0;
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(merged.buffer);
    }

    function startBrowserRecognition(id) {
      if (!BrowserSR) return;
      try {
        recog = new BrowserSR();
        recog.continuous = true;
        recog.interimResults = true;
        recog.lang = "en-US";
        recog.onresult = (e) => {
          let text = "";
          for (const r of e.results) text += r[0].transcript;
          browserLiveIds.add(id);
          setUserText(id, text.trim(), true);
        };
        recog.onerror = () => {};
        recog.start();
      } catch {
        recog = null;
      }
    }

    function stopBrowserRecognition() {
      if (!recog) return;
      try { recog.stop(); } catch {}
      recog = null;
    }

    function endUtterance() {
      if (tailTimer) { clearTimeout(tailTimer); tailTimer = null; }
      if (!capturing) return;
      capturing = false;
      stopBrowserRecognition();
      flushPcm();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "end_utterance" }));
        hint.textContent = "Thinking…";
      }
    }

    function startTalking() {
      if (!audioCtx || recording || !ws || ws.readyState !== WebSocket.OPEN) return;
      endUtterance(); // a press during the previous release tail closes that utterance first
      audioCtx.resume();
      recording = true;
      capturing = true;
      stopPlayback();
      if (incoming) incoming.skip = true;
      talkBtn.classList.add("recording");
      talkBtn.textContent = "Listening…";
      hint.textContent = "Listening…";
      pcmQueue = [];
      pcmQueued = 0;
      resampleCarry = new Float32Array(0);
      resamplePos = 0;
      uttId++;
      mutedBelow = uttId;
      setUserText(uttId, "", true);
      ws.send(JSON.stringify({ type: "start_utterance", id: uttId }));
      startBrowserRecognition(uttId);
    }

    function stopTalking() {
      if (!recording) return;
      recording = false;
      talkBtn.classList.remove("recording");
      talkBtn.textContent = "Hold to talk";
      tailTimer = setTimeout(endUtterance, TAIL_MS);
    }

    function prewarm() {
      if (ws && ws.readyState === WebSocket.OPEN && !recording) {
        ws.send(JSON.stringify({ type: "prewarm" }));
      }
    }
    talkBtn.addEventListener("pointerenter", prewarm);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) prewarm(); });

    talkBtn.addEventListener("mousedown", startTalking);
    talkBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTalking(); });
    talkBtn.addEventListener("mouseup", stopTalking);
    talkBtn.addEventListener("mouseleave", stopTalking);
    talkBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTalking(); });

    connect();
  </script>
</body>
</html>
