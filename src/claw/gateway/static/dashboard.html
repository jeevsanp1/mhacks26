<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claw chat</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #d8d4cc;
      --user: #e8e4dc;
      --bot: #fff;
      --tool: #faf9f6;
      --running: #8a6d1f;
      --done: #2f6b4f;
      --accent: #1a1a1a;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 650;
    }
    #status { font-size: 0.85rem; color: var(--muted); }
    #status.ok { color: var(--done); }
    #status.bad { color: #9b2c2c; }
    #log {
      flex: 1;
      overflow: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .msg {
      max-width: 42rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.assistant { align-self: flex-start; background: var(--bot); }
    .msg.assistant code {
      font-family: var(--mono);
      font-size: 0.85em;
      background: #f0ede7;
      padding: 0.05rem 0.25rem;
      border-radius: 4px;
    }
    .msg.meta {
      align-self: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.2rem;
    }
    .thinking {
      align-self: flex-start;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0 0.2rem;
    }
    details.tools {
      align-self: flex-start;
      width: min(42rem, 100%);
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: var(--tool);
    }
    details.tools > summary {
      cursor: pointer;
      padding: 0.45rem 0.75rem;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--done);
      list-style: none;
      user-select: none;
    }
    details.tools > summary::-webkit-details-marker { display: none; }
    details.tools > summary::before { content: "▸ "; color: var(--muted); }
    details.tools[open] > summary::before { content: "▾ "; }
    details.tools.running > summary { color: var(--running); }
    .tool-entry { border-top: 1px solid var(--line); padding: 0.5rem 0.75rem; }
    .tool-entry .name {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .tool-entry .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0.35rem 0 0.15rem;
    }
    .tool-entry pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 0.78rem/1.35 var(--mono);
      max-height: 18rem;
      overflow: auto;
    }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    input[type="text"] {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <header>
    <h1>Claw</h1>
    <span id="status">connecting…</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Message…" autocomplete="off" autofocus />
    <button id="send" type="submit" disabled>Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const sessionKey = "web";
    let ws = null;
    let nextId = 1;
    let connectId = null;
    let historyId = null;
    let pending = null; // { agentId, waitId, runId, early, turn }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderText(el, text) {
      el.innerHTML = escapeHtml(text)
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function scrollToEnd() {
      log.scrollTop = log.scrollHeight;
    }

    function addMsg(role, text, before) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      if (role === "assistant") renderText(el, text);
      else el.textContent = text;
      log.insertBefore(el, before || null);
      scrollToEnd();
      return el;
    }

    function pretty(value) {
      if (value === undefined || value === null || value === "") return "";
      let text = value;
      if (typeof value === "string") {
        try { text = JSON.stringify(JSON.parse(value), null, 2); } catch { text = value; }
      } else {
        text = JSON.stringify(value, null, 2);
      }
      return text.length > 4000 ? text.slice(0, 4000) + "…" : text;
    }

    // ---- turn rendering (mirrors the TUI) ----
    // Text and tools render in stream order. Consecutive tool calls share one
    // collapsible group; assistant text after a tool starts a new bubble below it.

    function newTurn(live) {
      const turn = { textEl: null, textBuf: "", group: null, tools: new Map(), sawText: false };
      if (live) {
        turn.thinking = document.createElement("div");
        turn.thinking.className = "thinking";
        turn.thinking.textContent = "thinking…";
        log.appendChild(turn.thinking);
        scrollToEnd();
      }
      return turn;
    }

    function endTurn(turn) {
      if (turn.thinking) turn.thinking.remove();
      turn.thinking = null;
      for (const entry of turn.tools.values()) {
        if (!entry.done) { entry.done = true; updateGroup(entry.group); }
      }
    }

    function appendText(turn, delta) {
      if (!turn.textEl) {
        turn.textEl = addMsg("assistant", "", turn.thinking);
        turn.textBuf = "";
        turn.group = null;
      }
      turn.textBuf += delta;
      turn.sawText = true;
      renderText(turn.textEl, turn.textBuf);
      scrollToEnd();
    }

    function groupTitle(entries) {
      const done = entries.every((e) => e.done);
      const mark = done ? "✓" : "⚙";
      const names = entries.map((e) => e.name);
      const counts = new Map();
      for (const n of names) counts.set(n, (counts.get(n) || 0) + 1);
      let label;
      if (counts.size === 1) {
        const [name, n] = counts.entries().next().value;
        label = n > 1 ? `${name} ×${n}` : name;
      } else if (names.length <= 3) {
        label = names.join(", ");
      } else {
        label = `${names.length} tools`;
      }
      return { text: `${mark} ${label}`, done };
    }

    function updateGroup(group) {
      const { text, done } = groupTitle(group.entries);
      group.summary.textContent = text;
      group.details.classList.toggle("running", !done);
    }

    function renderEntry(entry) {
      const el = entry.el;
      el.replaceChildren();
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = `${entry.done ? "✓" : "⚙"} ${entry.name}`;
      el.appendChild(name);
      for (const [label, value] of [["args", entry.args], ["result", entry.result]]) {
        const body = pretty(value);
        if (!body) continue;
        const l = document.createElement("div");
        l.className = "label";
        l.textContent = label;
        const pre = document.createElement("pre");
        pre.textContent = body;
        el.append(l, pre);
      }
    }

    function addTool(turn, { id, name, args, result, done }) {
      if (!turn.group) {
        const details = document.createElement("details");
        details.className = "tools";
        const summary = document.createElement("summary");
        details.appendChild(summary);
        log.insertBefore(details, turn.thinking || null);
        turn.group = { details, summary, entries: [] };
        turn.textEl = null;
      }
      const el = document.createElement("div");
      el.className = "tool-entry";
      turn.group.details.appendChild(el);
      const entry = { name: name || "tool", args, result, done: !!done, el, group: turn.group };
      turn.group.entries.push(entry);
      if (id) turn.tools.set(id, entry);
      renderEntry(entry);
      updateGroup(turn.group);
      scrollToEnd();
    }

    function finishTool(turn, { id, name, result }) {
      const entry = id && turn.tools.get(id);
      if (!entry) {
        addTool(turn, { id, name, result, done: true });
        return;
      }
      entry.result = result;
      entry.done = true;
      renderEntry(entry);
      updateGroup(entry.group);
    }

    function onAgentEvent(turn, p) {
      const data = p.data || {};
      if (p.stream === "assistant" && data.delta) {
        appendText(turn, data.delta);
      } else if (p.stream === "tool") {
        const info = { id: data.toolCallId, name: data.toolName, args: data.args, result: data.result };
        if (data.phase === "call") addTool(turn, info);
        else if (data.phase === "result") finishTool(turn, info);
      }
    }

    function renderHistory(entries) {
      log.replaceChildren();
      let turn = null;
      for (const e of entries) {
        if (e.kind === "user") {
          addMsg("user", e.text);
          turn = null;
          continue;
        }
        turn = turn || newTurn(false);
        if (e.kind === "assistant") {
          turn.textEl = null; // each persisted text part is its own bubble
          appendText(turn, e.text);
        } else if (e.kind === "tool") {
          addTool(turn, { name: e.name, args: e.args, result: e.result, done: true });
        }
      }
      scrollToEnd();
    }

    // ---- gateway protocol ----

    function req(method, params) {
      const id = String(nextId++);
      ws.send(JSON.stringify({ type: "req", id, method, params: params || {} }));
      return id;
    }

    function finishPending() {
      if (pending) endTurn(pending.turn);
      pending = null;
      sendBtn.disabled = false;
      input.focus();
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => {
        connectId = req("connect", {
          minProtocol: 1,
          maxProtocol: 1,
          role: "operator",
          client: { id: "web", version: "0.1.0", mode: "operator" },
        });
      };

      ws.onmessage = (ev) => {
        let frame;
        try { frame = JSON.parse(ev.data); } catch { return; }

        if (frame.type === "res" && frame.id === connectId) {
          if (!frame.ok) {
            setStatus("auth failed", "bad");
            addMsg("meta", frame.error?.message || "connect failed");
            return;
          }
          setStatus("connected", "ok");
          sendBtn.disabled = false;
          if (!pending) historyId = req("chat.history", { sessionKey });
          return;
        }

        if (frame.type === "res" && frame.id === historyId) {
          if (frame.ok && !pending) renderHistory(frame.payload?.entries || []);
          return;
        }

        if (pending && frame.type === "res" && frame.id === pending.agentId) {
          if (!frame.ok) {
            addMsg("meta", frame.error?.message || "rejected", pending.turn.thinking);
            finishPending();
            return;
          }
          pending.runId = frame.payload?.runId;
          pending.waitId = req("agent.wait", { runId: pending.runId });
          for (const p of pending.early) {
            if (p.runId === pending.runId) onAgentEvent(pending.turn, p);
          }
          pending.early = [];
          return;
        }

        if (pending && frame.type === "event" && frame.event === "agent") {
          const p = frame.payload || {};
          // Events can beat the agent response that carries our runId; hold them until then.
          if (!pending.runId) pending.early.push(p);
          else if (p.runId === pending.runId) onAgentEvent(pending.turn, p);
          return;
        }

        if (pending && frame.type === "res" && frame.id === pending.waitId) {
          const turn = pending.turn;
          if (!frame.ok) {
            addMsg("meta", frame.error?.message || "wait failed", turn.thinking);
          } else {
            const out = frame.payload?.output;
            if (!turn.sawText && out) appendText(turn, out);
            if (frame.payload?.status && frame.payload.status !== "ok") {
              addMsg(
                "meta",
                `${frame.payload.status}: ${frame.payload.error || ""}`.trim(),
                turn.thinking
              );
            } else if (!turn.sawText && !turn.tools.size) {
              addMsg("meta", "(empty reply)", turn.thinking);
            }
          }
          finishPending();
        }
      };

      ws.onclose = () => {
        setStatus("disconnected — retrying…", "bad");
        sendBtn.disabled = true;
        if (pending) endTurn(pending.turn);
        pending = null;
        setTimeout(connect, 1500);
      };

      ws.onerror = () => {
        setStatus("connection error", "bad");
      };
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN || pending) return;

      addMsg("user", text);
      input.value = "";
      sendBtn.disabled = true;
      const agentId = req("agent", {
        message: text,
        sessionKey,
        idempotencyKey: crypto.randomUUID(),
      });
      pending = { agentId, waitId: null, runId: null, early: [], turn: newTurn(true) };
    });

    connect();
  </script>
</body>
</html>
