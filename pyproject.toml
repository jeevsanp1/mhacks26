[project]
name = "claw"
version = "0.1.0"
description = "OpenClaw-style AI harness built on Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-harness[anthropic]>=0.54.0",
    "pydantic-ai-slim[openai]>=2.54.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "textual>=8.2.8",
    "croniter>=6.2.4",
    "ddgs>=9.16.0",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
claw = "claw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claw"]

[tool.hatch.build.targets.wheel.force-include]
"src/claw/gateway/static" = "claw/gateway/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
